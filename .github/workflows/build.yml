name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: Protocol conformance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The C# and Kotlin implementations have to agree byte for byte. Vectors
      # are regenerated here and the Kotlin side asserted against them, so a
      # change to one side that silently diverges from the other fails the build
      # rather than the handshake.
      - name: Run C# protocol checks
        run: dotnet run --project windows/tests/WinBridge.Core.Tests

      - name: Regenerate cross-language vectors
        run: dotnet run --project windows/tests/WinBridge.Core.Tests -- --vectors

      - name: Fail if vectors drifted
        shell: bash
        run: |
          if ! git diff --quiet -- android/core/protocol/src/test/resources/protocol-vectors.json; then
            echo "::error::Committed vectors do not match what the C# side generates."
            git diff -- android/core/protocol/src/test/resources/protocol-vectors.json
            exit 1
          fi

      - name: Run Kotlin protocol tests
        working-directory: android
        run: ./gradlew :core:protocol:test --no-daemon

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Unsigned: the release keystore is deliberately not in CI. Signed builds
      # are produced locally and attached to releases by hand.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      # The watch is a separate module with its own dependencies, and nothing
      # else here compiles it. Left out, a broken tile or complication reaches a
      # release without a single build ever having looked at it.
      - name: Build watch debug APK
        working-directory: android
        run: ./gradlew :wear:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wear-debug
          path: android/wear/build/outputs/apk/debug/wear-debug.apk

  windows:
    name: Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build windows/src/WinBridge.App/WinBridge.App.csproj -c Release

      - name: Publish
        run: >
          dotnet publish windows/src/WinBridge.App/WinBridge.App.csproj
          -c Release -r win-x64 --self-contained true
          -o windows/publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: winbridge-win-x64
          path: windows/publish/win-x64
